    <style>

        /* =========================
           КАРТА / КАТАЛОГ
        ========================= */

        .view-switcher {
            display: flex;
            gap: 8px;
            margin: 10px 12px 14px;
        }

        .view-btn {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 12px 10px;
            font-size: 15px;
            font-weight: 700;
            background: #f1f1f1;
            color: #333;
            cursor: pointer;
        }

        .view-btn.active {
            background: #ff7a00;
            color: white;
        }


        /* =========================
           MAP
        ========================= */

        #map {
            display: none;
            width: 100%;
            height: calc(100vh - 185px);
            min-height: 480px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
        }


        /* =========================
           PRICE MARKER
        ========================= */

        .price-marker {
            background: white;
            border: 2px solid #ff7a00;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.18);
            padding: 6px 9px;
            font-weight: 800;
            color: #222;
            white-space: nowrap;
            font-size: 13px;
        }


        /* =========================
           CLUSTER MARKER
        ========================= */

        .cluster-marker {
            background: #ff7a00;
            color: white;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 800;
            font-size: 12px;
            line-height: 1.05;
        }


        /* =========================
           MAP POPUP
        ========================= */

        .map-popup {
            min-width: 190px;
        }

        .map-popup .map-price {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .map-popup .map-title {
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .map-popup button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 8px;
            background: #ff7a00;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }


        /* =========================
           FILTER WINDOW
        ========================= */

        .filter-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0,0,0,.35);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .filter-window {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }

        .filter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .filter-header h2 {
            margin: 0;
            font-size: 21px;
        }

        .filter-close {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: #f1f1f1;
            font-size: 20px;
            cursor: pointer;
        }

        .filter-window-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-window-content select,
        .filter-window-content input {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .filter-window-content select:focus,
        .filter-window-content input:focus {
            border-color: #ff7a00;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .filter-actions button {
            flex: 1;
            min-height: 46px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .filter-actions button:first-child {
            background: #ff7a00;
            color: white;
        }

        .filter-actions button:last-child {
            background: #f1f1f1;
            color: #444;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .view-switcher {
                margin: 8px;
                gap: 6px;
            }

            .view-btn {
                font-size: 13px;
                padding: 10px 5px;
            }

            .filter-overlay {
                padding: 12px;
            }

            .filter-window {
                max-width: 100%;
                border-radius: 18px;
                padding: 17px;
            }

        }

<script>

function openFilters() {

    const overlay =
        document.getElementById(
            "filterOverlay"
        );

    if (!overlay) {

        console.error(
            "❌ #filterOverlay not found"
        );

        return;

    }

    overlay.style.display =
        "flex";

    console.log(
        "🔎 Filters opened"
    );

}



function closeFilters() {

    const overlay =
        document.getElementById("filterOverlay");

    if (!overlay) {
        return;
    }

    overlay.style.display = "none";

    console.log("🔴 Filters closed");
}


function applyFilters() {

    console.log("🔎 APPLY FILTERS");

    const district =
        document.getElementById(
            "filterDistrict"
        );

    const rooms =
        document.getElementById(
            "filterRooms"
        );

    const minPrice =
        document.getElementById(
            "filterMinPrice"
        );

    const maxPrice =
        document.getElementById(
            "filterMaxPrice"
        );

    const mainRooms =
        document.getElementById(
            "roomsFilter"
        );

    const mainMinPrice =
        document.getElementById(
            "minPrice"
        );

    const mainMaxPrice =
        document.getElementById(
            "maxPrice"
        );


    if (
        rooms &&
        mainRooms
    ) {

        mainRooms.value =
            rooms.value;

    }


    if (
        minPrice &&
        mainMinPrice
    ) {

        mainMinPrice.value =
            minPrice.value;

    }


    if (
        maxPrice &&
        mainMaxPrice
    ) {

        mainMaxPrice.value =
            maxPrice.value;

    }


    /*
       RUN MAIN FILTER
    */

    if (
        typeof filterPosts ===
        "function"
    ) {

        filterPosts();

    }


    /*
       CLOSE FILTER PANEL
    */

    closeFilters();


    console.log(
        "✅ Filters applied"
    );

}


function clearFilterWindow() {

    const district =
        document.getElementById("filterDistrict");

    const rooms =
        document.getElementById("filterRooms");

    const minPrice =
        document.getElementById("filterMinPrice");

    const maxPrice =
        document.getElementById("filterMaxPrice");


    if (district)
        district.value = "";

    if (rooms)
        rooms.value = "";

    if (minPrice)
        minPrice.value = "";

    if (maxPrice)
        maxPrice.value = "";


    applyFilters();

}


document.addEventListener(
    "click",
    function(event) {

        const overlay =
            document.getElementById("filterOverlay");

        if (!overlay)
            return;

        if (
            overlay.style.display === "flex" &&
            event.target === overlay
        ) {

            closeFilters();

        }

    }
);

</script>
<script>

/* =========================
   PROMO TEXT ANIMATION
========================= */

(function () {

    const lines =
        document.querySelectorAll(".promo-line");

    if (!lines.length) return;

    let current = 0;

    setInterval(function () {

        lines[current].classList.remove("active");

        current =
            (current + 1) % lines.length;

        lines[current].classList.add("active");

    }, 3500);

})();

</script>
