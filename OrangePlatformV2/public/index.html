    <style>

        /* =========================
           КАРТА / КАТАЛОГ
        ========================= */

        .view-switcher {
            display: flex;
            gap: 8px;
            margin: 10px 12px 14px;
        }

        .view-btn {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 12px 10px;
            font-size: 15px;
            font-weight: 700;
            background: #f1f1f1;
            color: #333;
            cursor: pointer;
        }

        .view-btn.active {
            background: #ff7a00;
            color: white;
        }


        /* =========================
           MAP
        ========================= */

        #map {
            display: none;
            width: 100%;
            height: calc(100vh - 185px);
            min-height: 480px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
        }


        /* =========================
           PRICE MARKER
        ========================= */

        .price-marker {
            background: white;
            border: 2px solid #ff7a00;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.18);
            padding: 6px 9px;
            font-weight: 800;
            color: #222;
            white-space: nowrap;
            font-size: 13px;
        }


        /* =========================
           CLUSTER MARKER
        ========================= */

        .cluster-marker {
            background: #ff7a00;
            color: white;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 800;
            font-size: 12px;
            line-height: 1.05;
        }


        /* =========================
           MAP POPUP
        ========================= */

        .map-popup {
            min-width: 190px;
        }

        .map-popup .map-price {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .map-popup .map-title {
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .map-popup button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 8px;
            background: #ff7a00;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }


        /* =========================
           FILTER WINDOW
        ========================= */

        .filter-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0,0,0,.35);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .filter-window {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }

        .filter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .filter-header h2 {
            margin: 0;
            font-size: 21px;
        }

        .filter-close {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: #f1f1f1;
            font-size: 20px;
            cursor: pointer;
        }

        .filter-window-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
.district-checkboxes {
    max-height: 260px;
    overflow-y: auto;
    overflow-x: hidden;
}
        .filter-window-content select,
        .filter-window-content input {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .filter-window-content select:focus,
        .filter-window-content input:focus {
            border-color: #ff7a00;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .filter-actions button {
            flex: 1;
            min-height: 46px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .filter-actions button:first-child {
            background: #ff7a00;
            color: white;
        }

        .filter-actions button:last-child {
            background: #f1f1f1;
            color: #444;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .view-switcher {
                margin: 8px;
                gap: 6px;
            }

            .view-btn {
                font-size: 13px;
                padding: 10px 5px;
            }

            .filter-overlay {
                padding: 12px;
            }

        .filter-window {
    width: 84%;
    max-width: 360px;
    max-height: 80vh;
    border-radius: 18px;
    padding: 12px;
    box-sizing: border-box;
    overflow-y: auto;
}
/* MOBILE DISTRICTS */
.district-checkboxes {
    max-height: 170px;
    overflow-y: auto;

/* =========================
   LISTING ID
========================= */

.listing-id-box {
    background: #fff;
    border: 1.5px solid #ff8a00;
    border-radius: 18px;
    padding: 10px;
    margin-bottom: 4px;
}

.listing-id-title {
    font-size: 17px;
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
}

.listing-id-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.listing-id-row input {
    flex: 1;
    min-width: 0;
    height: 48px;
    box-sizing: border-box;
    padding: 0 14px;
    border: 1px solid #d8d8d8;
    border-radius: 12px;
    background: #fff;
    font-size: 16px;
    color: #222;
    outline: none;
}

.listing-id-row input:focus {
    border-color: #ff8a00;
    box-shadow: 0 0 0 3px rgba(255, 138, 0, 0.12);
}

.listing-id-search {
    width: 50px;
    height: 48px;
    border: none;
    border-radius: 12px;
    background: #ff8a00;
    color: white;
    font-size: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.listing-id-search:active {
    transform: scale(0.96);
}

.listing-id-hint {
    margin-top: 7px;
    font-size: 12px;
    color: #888;
}

/* ===== MINIMAL ORANGE HEADER ===== */

.minimal-header {
    height: 72px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;

    background: #fff;
    border-bottom: 1px solid #eee;
    box-shadow: 0 3px 14px rgba(0,0,0,.06);

    position: relative;
    z-index: 1000;
}

.minimal-logo {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.5px;
    white-space: nowrap;
}

.logo-orange {
    font-size: 25px;
}

.logo-orange-text {
    color: #ff8a00;
}

.logo-dark-text {
    color: #20242a;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 18px;
}

.header-stats-btn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;

    height: 42px;
    padding: 0 17px;

    border: 1px solid #ff9a2f;
    border-radius: 12px;

    background: #fffaf5;
    color: #ed7900;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
}

.stats-icon {
    font-size: 21px;
}

.header-menu {
    width: 32px;
    height: 32px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
}

.header-menu span {
    width: 24px;
    height: 2px;
    margin-left: auto;

    background: #20242a;
    border-radius: 2px;
}


/* ===== MOBILE ===== */

@media (max-width: 600px) {

    .minimal-header {
        height: 60px;
        padding: 0 15px;
    }

    .minimal-logo {
        font-size: 19px;
        gap: 4px;
    }

    .logo-orange {
        font-size: 21px;
    }

    .header-actions {
        gap: 9px;
    }

    .header-stats-btn {
        height: 37px;
        padding: 0 10px;
        border-radius: 10px;
        font-size: 13px;
    }

    .stats-icon {
        font-size: 18px;
    }

    .header-menu {
        width: 27px;
    }

    .header-menu span {
        width: 21px;
    }
}

/* DISTRICT OPEN / CLOSE */

.district-checkboxes {
    display: block;
    margin-top: 8px;
}

.district-checkboxes.district-closed {
    display: none;
}

.district-toggle {
    width: 100%;
    min-height: 52px;
    padding: 0 15px;

    align-items: center;

    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.district-toggle-title {
    display: flex;
    align-items: center;
    gap: 7px;
}

.district-toggle-arrow {
    font-size: 18px;
    color: #ff8a00;
    transition: transform 0.2s ease;
}

.district-toggle.open .district-toggle-arrow {
    transform: rotate(180deg);
}

<script>

function openFilters() {

    const overlay =
        document.getElementById(
            "filterOverlay"

        console.error(
            "❌ #filterOverlay not found"
        );

        return;

    }

    overlay.style.display =
        "flex";

    console.log(
        "🔎 Filters opened"

}



function closeFilters() {

    const overlay =
        document.getElementById("filterOverlay");

    if (!overlay) {
        return;
    }

    overlay.style.display = "none";

    console.log("🔴 Filters closed");
}


function applyFilters() {

    console.log("🔎 APPLY FILTERS");

    const district =
        document.getElementById(
            "filterDistrict"
        );

    const rooms =
        document.getElementById(
            "filterRooms"
        );

        document.getElementById(

    if (

        mainMinPrice.value =

    }


    if (
        maxPrice &&
        mainMaxPrice

        mainMaxPrice.value =

function clearFilterWindow() {

    console.log("🗑 CLEAR FILTERS");

    /* =========================
       RESET DISTRICTS
    ========================= */

    const districtContainer =
        document.getElementById(
            "filterDistrict"
        );

    if (districtContainer) {

        const checkboxes =
            districtContainer.querySelectorAll(
                'input[type="checkbox"]'
            );

        checkboxes.forEach(
            checkbox => {
                checkbox.checked = false;
            }
        );

        const allDistricts =
            document.getElementById(
                "allDistricts"
            );

        if (allDistricts) {
            allDistricts.checked = true;
        }
    }


    /* =========================
       RESET ROOMS
    ========================= */

    const rooms =
        document.getElementById(
            "filterRooms"
        );

        rooms.value = "";

    ========================= */

    const minPrice =
        document.getElementById(
            "filterMinPrice"
        );

    const maxPrice =
        document.getElementById(
            "filterMaxPrice"
        );

    if (minPrice) {
        minPrice.value = "";
    }

    if (maxPrice) {
        maxPrice.value = "";
    }


    /* =========================
       RESET MAIN FILTERS
    ========================= */

    const mainDistrict =
        document.getElementById(
            "legacyDistrictFilter"
        );

    const mainRooms =
        document.getElementById(
            "roomsFilter"
        );

        document.getElementById(

    const mainMaxPrice =
        document.getElementById(

        );

        mainDistrict.value = "";

        mainRooms.value = "";

        mainMinPrice.value = "";
    }

    if (mainMaxPrice) {

    ) {

    console.log(

    );
}
document.addEventListener(
    "click",
    function(event) {

        const overlay =
            document.getElementById("filterOverlay");

        if (!overlay)

        if (

(function () {

    const lines =
        document.querySelectorAll(".promo-line");

    if (!lines.length) return;

    let current = 0;

    setInterval(function () {

        lines[current].classList.remove("active");

        current =
            (current + 1) % lines.length;

        lines[current].classList.add("active");

    }, 3500);

<script>
function toggleDistricts() {

    const box = document.getElementById("filterDistrict");
    const button = document.getElementById("districtToggle");

    if (!box) return;

    const arrow = button
        ? button.querySelector(".district-toggle-arrow")
        : null;

    if (box.classList.contains("district-hidden")) {

        box.classList.remove("district-hidden");
        box.classList.add("district-visible");

        if (button) {
            button.setAttribute("aria-expanded", "true");
        }

        if (arrow) {
            arrow.textContent = "⌃";
        }

    } else {

        box.classList.remove("district-visible");
        box.classList.add("district-hidden");

        if (button) {
            button.setAttribute("aria-expanded", "false");
        }

        if (arrow) {
            arrow.textContent = "⌄";
        }
    }
}
</script>

        const mapBtn =

        if (mapBtn)

        const listingInput =

        const allDistricts =

            );

        if (allDistricts)
            allDistricts.textContent = t.allDistricts;


        const filterRooms =
            document.getElementById("filterRooms");

        if (filterRooms && filterRooms.options[0])
            filterRooms.options[0].textContent =

        const filterMinPrice =
            document.getElementById("filterMinPrice");

        if (filterMinPrice)
            filterMinPrice.placeholder =
                t.priceFrom + " $";


        const filterMaxPrice =
            document.getElementById("filterMaxPrice");

        if (filterMaxPrice)
            filterMaxPrice.placeholder =
                t.priceTo + " $";


        /* BUTTONS */

        const buttons =
            document.querySelectorAll(".filter-actions button");

        if (buttons[0])
            buttons[0].textContent = t.find;

        if (buttons[1])
            buttons[1].textContent = t.clear;


        /* LOADING */

        const posts =
            document.getElementById("posts");

        if (
            posts &&
            (
                posts.textContent.trim() === "Загрузка..." ||
                posts.textContent.trim() === "იტვირთება..." ||
                posts.textContent.trim() === "Loading..."

            posts.textContent = t.loading;

        /* SAVE LANGUAGE */

        localStorage.setItem(

    function setLanguageFlag(lang) {

            languageBtn.innerHTML = `

    /* OPEN / CLOSE MENU */

    languageBtn.addEventListener("click", function (event) {

        event.preventDefault();
        event.stopPropagation();

        languageMenu.classList.toggle("open");

    });


    /* LANGUAGE SELECT */

    languageOptions.forEach(function (option) {

        option.addEventListener("click", function (event) {

            event.preventDefault();

            const lang = option.dataset.lang;

            setLanguageFlag(lang);

            translatePlatform(lang);
            if (typeof window.setOrangeLanguage === "function") {
    window.setOrangeLanguage(lang);
}

            languageOptions.forEach(function (item) {
                item.classList.remove("active");
            });

            option.classList.add("active");

            languageMenu.classList.remove("open");

        });

    });


    /* CLOSE WHEN CLICK OUTSIDE */

    document.addEventListener("click", function (event) {

        if (
            !languageBtn.contains(event.target) &&
            !languageMenu.contains(event.target)
        ) {
            languageMenu.classList.remove("open");
        }

    });


    /* LOAD SAVED LANGUAGE */

    const savedLanguage =
        localStorage.getItem("orange-language") || "ru";

})();
