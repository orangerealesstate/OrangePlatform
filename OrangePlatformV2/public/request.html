<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Подать запрос</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 16px 30px;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 800;
        }

        .subtitle {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,.07);
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #444;
        }

        select,
        input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #ddd;
            border-radius: 13px;
            background: #fafafa;
            font-size: 16px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #ff6600;
            background: white;
        }

        .rooms {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }

        .room {
            height: 45px;
            border: 1px solid #ddd;
            border-radius: 11px;
            background: #fafafa;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
        }

        .room.active {
            background: #ff6600;
            color: white;
            border-color: #ff6600;
        }

        .pets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .pet {
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 13px;
            background: #fafafa;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .pet.active {
            background: #ff6600;
            color: white;
            border-color: #ff6600;
        }

        .submit {
            width: 100%;
            height: 54px;
            margin-top: 5px;
            border: none;
            border-radius: 15px;
            background: #ff6600;
            color: white;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .submit:active {
            transform: scale(.98);
        }

        .error {
            display: none;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 12px;
            background: #ffe9e9;
            color: #d93025;
            font-size: 14px;
            font-weight: 600;
        }

        .success {
            display: none;
            text-align: center;
            padding: 35px 15px;
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .success h2 {
            margin: 0 0 10px;
        }

        .success p {
            color: #777;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🍊</div>

        <h1>Подать запрос</h1>

        <div class="subtitle">
            Заполните форму, и мы подберём квартиру
        </div>
    </div>

    <div class="form-card" id="formCard">

        <div class="error" id="error">
            Пожалуйста, заполните все поля.
        </div>

        <!-- РАЙОН -->
        <div class="field">

            <label>📍 Район</label>

            <select id="district">

                <option value="">
                    Выберите район
                </option>

                <option>Ваке</option>
                <option>Сабуртало</option>
                <option>Вера</option>
                <option>Мтацминда</option>
                <option>Сололаки</option>
                <option>Чугурети</option>
                <option>Дидубе</option>
                <option>Надзаладеви</option>
                <option>Глдани</option>
                <option>Диди Дигоми</option>
                <option>Дигоми</option>
                <option>Темка</option>
                <option>Исани</option>
                <option>Самгори</option>
                <option>Варкетили</option>
                <option>Вазисубани</option>
                <option>Крцаниси</option>
                <option>Ортачала</option>
                <option>Фоничала</option>
                <option>Авлабари</option>
                <option>Навтлуги</option>
                <option>Тбилисское море</option>

            </select>

        </div>


        <!-- КОМНАТЫ -->
        <div class="field">

            <label>🛋 Количество комнат</label>

            <div class="rooms">

                <button class="room" data-value="1">1</button>
                <button class="room" data-value="2">2</button>
                <button class="room" data-value="3">3</button>
                <button class="room" data-value="4">4</button>
                <button class="room" data-value="5+">5+</button>

            </div>

        </div>


        <!-- ПЕРИОД -->
        <div class="field">

            <label>📅 Период аренды</label>

            <select id="period">

                <option value="">
                    Выберите период
                </option>

                <option>1 месяц</option>
                <option>3 месяца</option>
                <option>6 месяцев</option>
                <option>1 год</option>
                <option>Другое</option>

            </select>

        </div>


        <!-- ЦЕНА -->
        <div class="field">

            <label>💰 Цена / бюджет</label>

            <input
                id="budget"
                type="text"
                inputmode="decimal"
                placeholder="Например: до 800 $"
            >

        </div>


        <!-- PET -->
        <div class="field">

            <label>🐾 Домашнее животное</label>

            <div class="pets">

                <button class="pet" data-value="Да">
                    🐶 Да
                </button>

                <button class="pet" data-value="Нет">
                    Нет
                </button>

            </div>

        </div>


        <!-- DATE -->
        <div class="field">

            <label>🗓 Дата заселения</label>

            <input
                id="moveIn"
                type="date"
            >

        </div>


        <button
            class="submit"
            id="submitBtn"
        >
            📤 Отправить запрос
        </button>

    </div>


    <!-- SUCCESS -->

    <div
        class="form-card success"
        id="success"
    >

        <div class="success-icon">
            ✅
        </div>

        <h2>
            Заявка отправлена!
        </h2>

        <p>
            Спасибо! Мы получили ваш запрос
            и свяжемся с вами в ближайшее время.
        </p>

    </div>

</div>


<script>

const tg =
    window.Telegram?.WebApp || null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =========================================
   STATE
========================================= */

let selectedRooms = "";
let selectedPets = "";


/* =========================================
   ROOMS
========================================= */

document
    .querySelectorAll(".room")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".room")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                button.classList.add("active");

                selectedRooms =
                    button.dataset.value;

            }
        );

    });


/* =========================================
   PETS
========================================= */

document
    .querySelectorAll(".pet")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".pet")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                button.classList.add("active");

                selectedPets =
                    button.dataset.value;

            }
        );

    });


/* =========================================
   SUBMIT
========================================= */

document
    .getElementById("submitBtn")
    .addEventListener(
        "click",
        () => {

            const district =
                document.getElementById(
                    "district"
                ).value;

            const period =
                document.getElementById(
                    "period"
                ).value;

            const budget =
                document.getElementById(
                    "budget"
                ).value.trim();

            const moveIn =
                document.getElementById(
                    "moveIn"
                ).value;


            /* VALIDATION */

            if (
                !district ||
                !selectedRooms ||
                !period ||
                !budget ||
                !selectedPets ||
                !moveIn
            ) {

                document.getElementById(
                    "error"
                ).style.display = "block";

                return;
            }


            document.getElementById(
                "error"
            ).style.display = "none";


            /* DATA */

            const request = {

                district:
                    district,

                rooms:
                    selectedRooms,

                period:
                    period,

                budget:
                    budget,

                pets:
                    selectedPets,

                moveIn:
                    moveIn

            };


            console.log(
                "📝 REQUEST:",
                request
            );


            /* SEND TO TELEGRAM BOT */

            if (
                tg &&
                typeof tg.sendData === "function"
            ) {

                tg.sendData(
                    JSON.stringify(request)
                );

            }


            /* SUCCESS */

            document.getElementById(
                "formCard"
            ).style.display = "none";

            document.getElementById(
                "success"
            ).style.display = "block";

        }
    );

</script>

</body>
</html>
