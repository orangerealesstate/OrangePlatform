<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Orange Real Estate</title>

<link
    rel="stylesheet"
    href="style.css?v=20261103"
>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>
<header>

    <div style="
        display:flex;
        align-items:center;
        justify-content:space-between;
        width:100%;
    ">

        <h1 style="margin:0;">
            🍊 Orange Real Estate
        </h1>
        <div class="language-switcher">

    <button
        type="button"
        class="language-btn"
        data-lang="ka"
        onclick="setLanguage('ka')"
    >
        🇬🇪
    </button>

    <button
        type="button"
        class="language-btn"
        data-lang="ru"
        onclick="setLanguage('ru')"
    >
        🇷🇺
    </button>

    <button
        type="button"
        class="language-btn"
        data-lang="en"
        onclick="setLanguage('en')"
    >
        🇬🇧
    </button>

</div>

        <div class="language-switcher">

            <button
                type="button"
                class="language-btn"
                data-lang="ka"
                onclick="setLanguage('ka')"
            >
                🇬🇪
            </button>

            <button
                type="button"
                class="language-btn"
                data-lang="ru"
                onclick="setLanguage('ru')"
            >
                🇷🇺
            </button>

            <button
                type="button"
                class="language-btn"
                data-lang="en"
                onclick="setLanguage('en')"
            >
                🇬🇧
            </button>

        </div>

    </div>

</header>

<!-- =========================
     VIEW SWITCHER
========================= -->

<div class="view-switcher">

    <button
    class="view-btn active"
    onclick="showCatalog()"
>
    🏠 <span data-i18n="catalog">Каталог</span>
</button>

    <button
    class="view-btn"
    onclick="openFilters()"
>
    🔎 <span data-i18n="filter">Фильтр</span>
</button>

    <button
    class="view-btn"
    onclick="showMap()"
>
    🗺️ <span data-i18n="map">Карта</span>
</button>

</div>



<!-- =========================
     FILTER WINDOW
========================= -->

<div
    id="filterOverlay"
    class="filter-overlay"
>

    <div
        class="filter-window"
    >

        <div class="filter-header">

            <h2>
    🔎 <span data-i18n="filter">Фильтр</span>
</h2>

            <button
                type="button"
                class="filter-close"
                onclick="closeFilters()"
            >
                ✕
            </button>

        </div>


        <div class="search-panel">


            <!-- SEARCH -->

            <input
                type="text"
                id="search"
                placeholder="🔍 Поиск..."
                onkeyup="filterPosts()"
            >


            <!-- DISTRICT -->

            <select
                id="districtFilter"
                onchange="filterPosts()"
            >

                <option value="" data-i18n="allDistricts">
    Все районы
</option>

                <option>
                    Сабуртало
                </option>

                <option>
                    Ваке
                </option>

                <option>
                    Вера
                </option>

                <option>
                    Мтацминда
                </option>

                <option>
                    Исани
                </option>

                <option>
                    Ортачала
                </option>

                <option>
                    Диди Дигоми
                </option>

                <option>
                    Авлабари
                </option>

                <option>
                    Чугурети
                </option>

            </select>

<!-- METRO -->

<select
    id="metroFilter"
    onchange="filterPosts()"
>
    <option value="">ყველა მეტრო</option>
    <option value="დელისი">დელისი</option>
    <option value="ვაჟა-ფშაველა">ვაჟა-ფშაველა</option>
    <option value="სამედიცინო უნივერსიტეტი">სამედიცინო უნივერსიტეტი</option>
    <option value="ტექნიკური უნივერსიტეტი">ტექნიკური უნივერსიტეტი</option>
    <option value="ისანი">ისანი</option>
    <option value="ავლაბარი">ავლაბარი</option>
    <option value="რუსთაველი">რუსთაველი</option>
    <option value="თავისუფლების მოედანი">თავისუფლების მოედანი</option>
    <option value="მარჯანიშვილი">მარჯანიშვილი</option>
    <option value="სადგურის მოედანი">სადგურის მოედანი</option>
    <option value="დიდუბე">დიდუბე</option>
    <option value="ვარკეთილი">ვარკეთილი</option>
    <option value="სამგორი">სამგორი</option>
    <option value="300 არაგველი">300 არაგველი</option>
    <option value="გოცირიძე">გოცირიძე</option>
    <option value="ახმეტელის თეატრი">ახმეტელის თეატრი</option>
    <option value="სახელმწიფო უნივერსიტეტი">სახელმწიფო უნივერსიტეტი</option>
</select>

            
            <!-- ROOMS -->

            <select
                id="roomsFilter"
                onchange="filterPosts()"
            >

                <option value="" data-i18n="rooms">
    Комнаты
</option>

                <option value="1">
                    1
                </option>

                <option value="2">
                    2
                </option>

                <option value="3">
                    3
                </option>

                <option value="4">
                    4
                </option>

                <option value="5">
                    5+
                </option>

            </select>


            <!-- MIN PRICE -->

            <input
                type="number"
                id="minPrice"
                placeholder="Цена от $"
                data-i18n-placeholder="minPrice"
                onkeyup="filterPosts()"
            >


            <!-- MAX PRICE -->

            <input
    type="number"
    id="maxPrice"
    placeholder="Цена до $"
    data-i18n-placeholder="maxPrice"
    onkeyup="filterPosts()"
>


            <!-- FILTER ACTIONS -->

            <div class="filter-actions">

              <button
    type="button"
    onclick="clearFilters()"
>
    🗑 <span data-i18n="clear">Очистить</span>
</button>

                <button
    type="button"
    onclick="closeFilters()"
>
    ✓ <span data-i18n="done">Готово</span>
</button>

            </div>


        </div>

    </div>

</div>



<!-- =========================
     POSTS
========================= -->

<div
    id="posts"
    class="grid"
>

    Загрузка...

</div>



<script src="app.js?v=20261112"></script>


<script>

/* =========================
   OPEN FILTERS
========================= */

function openFilters() {

    const overlay =
        document.getElementById(
            "filterOverlay"
        );

    if (!overlay) return;

    overlay.style.display =
        "flex";

}


/* =========================
   CLOSE FILTERS
========================= */

function closeFilters() {

    const overlay =
        document.getElementById(
            "filterOverlay"
        );

    if (!overlay) return;

    overlay.style.display =
        "none";

}


/* =========================
   CLEAR FILTERS
========================= */

function clearFilters() {

    const search =
        document.getElementById(
            "search"
        );

    const district =
        document.getElementById(
            "districtFilter"
        );

    const rooms =
        document.getElementById(
            "roomsFilter"
        );

    const minPrice =
        document.getElementById(
            "minPrice"
        );

    const maxPrice =
        document.getElementById(
            "maxPrice"
        );


    if (search)
        search.value = "";


    if (district)
        district.value = "";
    const metro = document.getElementById("metroFilter");

if (metro)
    metro.value = "";


    if (rooms)
        rooms.value = "";


    if (minPrice)
        minPrice.value = "";


    if (maxPrice)
        maxPrice.value = "";


    if (
        typeof filterPosts ===
        "function"
    ) {

        filterPosts();

    }

}


/* =========================
   CLOSE BY CLICKING OUTSIDE
========================= */

document.addEventListener(
    "click",
    function(event) {

        const overlay =
            document.getElementById(
                "filterOverlay"
            );

        const windowBox =
            document.querySelector(
                ".filter-window"
            );

        if (!overlay || !windowBox)
            return;


        if (
            overlay.style.display ===
                "flex" &&
            event.target === overlay
        ) {

            closeFilters();

        }

    }
);

</script>


</body>

</html>
